<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bras Robot</title>
    <link rel="stylesheet" href="robot.css">
</head>

<body>

<h1>Bras Robot</h1>

<div class="etats">
    <h2 id="led">État de la LED : Éteinte</h2>
    <h2>|</h2>
    <h2 id="bouton">État du bouton : Relâché</h2>
</div>

<button class="bouton" onclick="changerEtat()">Activer / desactiver la led</button>

<script>

    let Led = false;
    let Bouton = false;


    function changerEtat() {

        // On inverse les états
        Led = !Led;
        Bouton = !Bouton;


        // On change l'affichage sur le site
        if (Led) {

            document.getElementById("led").textContent =
                "État de la LED : Allumée";

            document.getElementById("bouton").textContent =
                "État du bouton : Appuyé";

            // On demande à l'ESP32 d'allumer la LED
            fetch("/led/on");

        } 
        else {

            document.getElementById("led").textContent =
                "État de la LED : Éteinte";

            document.getElementById("bouton").textContent =
                "État du bouton : Relâché";

            // On demande à l'ESP32 d'éteindre la LED
            fetch("/led/off");
        }
    }

</script>
<style>
body {
    background-color:#121212;
    color: white;
}
h1 {
    text-align: center;
    font-size: 50px;
    margin-top: 22vh;
}
.etats {
    display: flex;
    justify-content: center;
    gap: 50px;
}
.bouton {
    display: block;
    margin: 12vh auto 0;
    width: 150px;
    height: 100px;
    border-radius: 0;
    background-color:#1DB954;
    color: white;
    font-size: 15px;
}
</style>
</body>
</html>
