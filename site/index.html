<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Commande Thermomix</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.csss') }}">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
    <main class="commande">
        <h1>Commande du robot</h1>
        <p class="sous-titre">Projet Fête de la science</p>

        <section class="carte">
            <p id="numero-etape">Étape 1</p>
            <h2 id="titre-etape">Chargement...</h2>
            <p id="description-etape"></p>

            <div class="commandes">
                <button id="precedent">Précédent</button>
                <button id="suivant">Suivant</button>
            </div>
        </section>

        <p><a href="/thermomix" target="_blank">Ouvrir l'écran Thermomix</a></p>
    </main>

    <script>
        const socket = io();

        document.getElementById("suivant").onclick = function () {
            socket.emit("suivant");
        };

        document.getElementById("precedent").onclick = function () {
            socket.emit("precedent");
        };

        socket.on("etape", function (data) {
            document.getElementById("numero-etape").textContent =
                "Étape " + (data.numero + 1) + " / " + data.total;
            document.getElementById("titre-etape").textContent = data.contenu.titre;
            document.getElementById("description-etape").textContent = data.contenu.description;
            document.getElementById("precedent").disabled = data.numero === 0;
            document.getElementById("suivant").disabled = data.numero === data.total - 1;
        });

        socket.on("etat_bouton", function (data) {
            if (data === true) {
                document.getElementById("statut-bouton").textContent = "Le bouton est appuyé";
            } else {
                document.getElementById("statut-bouton").textContent = "Le bouton est relâché";
            }
        });
    </script>
</body>
</html>
